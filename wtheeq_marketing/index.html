<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>فريق المبيعات | أساس مكين</title>
<meta name="description" content="تواصل مباشرة مع مستشاري المبيعات في أساس مكين، اتصال أو واتساب بضغطة واحدة.">
<meta name="theme-color" content="#0f3835">
<meta property="og:title" content="فريق المبيعات | أساس مكين">
<meta property="og:description" content="اختر مستشارك وتواصل مباشرة، اتصال أو واتساب.">
<meta property="og:type" content="website">
<style>
@font-face{font-family:'AGC';src:url('Fonts/ArbFONTS-AGCLight.ttf') format('truetype');font-weight:300;font-display:swap}
@font-face{font-family:'AGC';src:url('Fonts/ArbFONTS-AGCRegular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'AGC';src:url('Fonts/ArbFONTS-AGCBold.ttf') format('truetype');font-weight:700;font-display:swap}

:root{
  --teal-900:#0f3835;
  --teal-800:#194141;
  --teal-700:#195954;
  --teal-600:#2a7a73;
  --bronze-900:#6b4726;
  --bronze-700:#8b6030;
  --gold:#c9a97a;
  --gold-soft:#dcc4a0;
  --surface:#faf9f7;
  --page:#f3f0ec;
  --ink:#33302c;
  --ink-soft:#6c655d;
  --hair:#e7e1d9;
  --wa:#1faa59;
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'AGC','Tajawal',system-ui,sans-serif;
  background:var(--page);
  color:var(--ink);
  direction:rtl;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ---------- HERO ---------- */
.hero{
  position:relative;
  background:
    radial-gradient(120% 90% at 80% -10%, rgba(201,169,122,.16) 0%, rgba(201,169,122,0) 55%),
    linear-gradient(160deg,#1c615b 0%,var(--teal-700) 38%,var(--teal-900) 100%);
  color:#fff;
  padding:calc(env(safe-area-inset-top) + 48px) 24px 116px;
  text-align:center;
  overflow:hidden;
}
.hero::before{
  content:"";
  position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.05) 0 1.4px, transparent 1.6px),
    radial-gradient(circle at 88% 28%, rgba(255,255,255,.04) 0 1.4px, transparent 1.6px);
  background-size:42px 42px,52px 52px;
  opacity:.6;
  pointer-events:none;
}
/* faint architectural arch echo from the Makeen mark */
.hero .arch{
  position:absolute;left:50%;top:-60px;transform:translateX(-50%);
  width:520px;max-width:150%;height:auto;opacity:.10;pointer-events:none;
  stroke:var(--gold);stroke-width:2.5;fill:none;
}
.hero__inner{position:relative;z-index:2;max-width:520px;margin:0 auto}
.hero__logo{
  height:74px;width:auto;margin:0 auto 26px;display:block;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.28));
}
.hero h1{
  font-size:clamp(1.9rem,7vw,2.5rem);
  font-weight:700;line-height:1.3;letter-spacing:-.01em;
}
.hero p{
  margin-top:12px;color:var(--gold);font-size:clamp(1rem,3.8vw,1.18rem);
  font-weight:400;
}
.hint{
  display:inline-flex;align-items:center;gap:9px;margin-top:24px;
  padding:10px 20px;border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(201,169,122,.4);
  color:#f4ece0;font-size:.9rem;font-weight:400;
  backdrop-filter:blur(2px);
}
.hint svg{width:17px;height:17px;flex:none}

/* ---------- LIST ---------- */
.team{
  max-width:880px;margin:-72px auto 0;
  padding:0 18px calc(env(safe-area-inset-bottom) + 28px);
  position:relative;z-index:3;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(248px,1fr));
  gap:16px;
}
.card{
  background:var(--surface);
  border:1px solid var(--hair);
  border-radius:22px;
  padding:24px 22px 20px;
  box-shadow:0 18px 40px -24px rgba(15,56,53,.55),0 2px 6px rgba(15,56,53,.04);
  display:flex;flex-direction:column;
  opacity:0;transform:translateY(16px);
  animation:rise .6s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes rise{to{opacity:1;transform:none}}

.card__top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.avatar{
  width:54px;height:54px;min-width:54px;border-radius:16px;
  display:grid;place-items:center;
  font-size:1.5rem;font-weight:700;color:#fff;
  background:linear-gradient(140deg,var(--teal-600),var(--teal-800));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}
.card:nth-child(even) .avatar{
  background:linear-gradient(140deg,var(--bronze-700),var(--bronze-900));
}
.card__name{font-size:1.22rem;font-weight:700;color:var(--teal-700);line-height:1.2}
.card__role{font-size:.86rem;color:var(--ink-soft);margin-top:3px}

.phone{
  direction:ltr;text-align:right;
  font-size:.96rem;color:var(--ink-soft);
  letter-spacing:.04em;font-variant-numeric:tabular-nums;
  margin-bottom:16px;padding-right:2px;
}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  height:48px;border-radius:14px;
  font-family:inherit;font-size:.97rem;font-weight:700;
  text-decoration:none;cursor:pointer;
  transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s,background .18s;
  -webkit-tap-highlight-color:transparent;
}
.btn svg{width:19px;height:19px;flex:none}
.btn--call{
  background:linear-gradient(135deg,var(--teal-700),var(--teal-900));
  color:#fff;box-shadow:0 8px 18px -8px rgba(15,56,53,.7);
}
.btn--wa{
  background:#fff;color:var(--wa);
  border:1.5px solid rgba(31,170,89,.45);
}
.btn:active{transform:scale(.97)}
@media(hover:hover){
  .btn--call:hover{box-shadow:0 12px 24px -8px rgba(15,56,53,.75);transform:translateY(-2px)}
  .btn--wa:hover{background:var(--wa);color:#fff;border-color:var(--wa);transform:translateY(-2px)}
}

/* ---------- FOOTER ---------- */
.foot{
  text-align:center;padding:30px 24px 40px;
  color:var(--ink-soft);font-size:.86rem;
}
.foot strong{color:var(--bronze-900);font-weight:700}
.foot a{color:var(--teal-700);text-decoration:none;direction:ltr;display:inline-block;margin-top:4px;font-size:.82rem}
.foot .rule{width:42px;height:2px;background:var(--gold);border-radius:2px;margin:0 auto 16px;opacity:.7}

@media(max-width:380px){
  .actions{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  .card{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>

<header class="hero">
  <svg class="arch" viewBox="0 0 200 160" aria-hidden="true">
    <path d="M20 150 V70 L100 12 L180 70 V150"/>
    <path d="M48 150 V86 L100 44 L152 86 V150"/>
    <path d="M76 150 V104 L100 80 L124 104 V150"/>
  </svg>
  <div class="hero__inner">
    <img class="hero__logo" src="assets/logo.png" alt="أساس مكين">
    <h1>فريق المبيعات</h1>
    <p>تواصل مباشرة مع مستشاري أساس مكين العقاريين</p>
    <span class="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M3 12h18M3 19h12"/></svg>
      اختر مستشارك واتصل أو راسله على واتساب
    </span>
  </div>
</header>

<main class="team">
  <div class="grid" id="grid"></div>
</main>

<footer class="foot">
  <div class="rule"></div>
  <div>فريق المبيعات لدى <strong>أساس مكين للتطوير العقاري</strong></div>
  <a href="https://asasmakeen.com" target="_blank" rel="noopener">asasmakeen.com</a>
</footer>

<script>
const TEAM = [
  {name:"أسماء", phone:"0531051119"},
  {name:"طلال",  phone:"0552407381"},
  {name:"شيماء", phone:"0537111862"},
  {name:"محمود", phone:"0536765039"},
  {name:"زبيدة", phone:"0552714086"},
  {name:"سعد",   phone:"0536764503"},
  {name:"مهند",  phone:"0537108815"},
  {name:"ريان",  phone:"0536312574"},
];
const ROLE = "مستشار مبيعات عقارية";
const WA_MSG = encodeURIComponent("السلام عليكم، شاهدت أحد مشاريع أساس مكين وأرغب بالاستفسار.");

const callIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
const waIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.87 9.87 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.11.82.83-3.04-.2-.31a8.21 8.21 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.82c0 4.54-3.69 8.24-8.24 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.43.13-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.47-.07 1.47-.6 1.67-1.18.21-.58.21-1.08.14-1.18-.06-.11-.22-.17-.47-.29z"/></svg>';

function toWa(p){ return "966" + p.replace(/^0/,""); }
function fmt(p){ return p.replace(/(\d{4})(\d{3})(\d{3})/, "$1 $2 $3"); }

const grid = document.getElementById("grid");
TEAM.forEach((m,i)=>{
  const card = document.createElement("div");
  card.className = "card";
  card.style.animationDelay = (i*70)+"ms";
  card.innerHTML = `
    <div class="card__top">
      <div class="avatar">${m.name.charAt(0)}</div>
      <div>
        <div class="card__name">${m.name}</div>
        <div class="card__role">${ROLE}</div>
      </div>
    </div>
    <div class="phone">${fmt(m.phone)}</div>
    <div class="actions">
      <a class="btn btn--call" href="tel:${m.phone}">${callIcon} اتصال</a>
      <a class="btn btn--wa" href="https://wa.me/${toWa(m.phone)}?text=${WA_MSG}" target="_blank" rel="noopener">${waIcon} واتساب</a>
    </div>`;
  grid.appendChild(card);
});
</script>
</body>
</html>
